<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compact Living – Möblierte Zimmer / Furnished rooms</title>
<meta name="description" content="Furnished rooms and beds for students and nurses in Germany. / Möblierte Zimmer und Betten für Studierende und Pflegekräfte.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23D91E2B%27/%3E%3Cpath d=%27M7 16l9-8 9 8v9H7z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* Same look as cgrecruiting.de: Space Grotesk / Inter / IBM Plex Mono, red + black + cream. */
:root{
  --ink:#0A0A0A;--ink-lt:#1A1A1A;--paper:#F7F5F0;--parch:#ECE8DE;--line:#DCD6C6;
  --red:#D91E2B;--red-lt:#E6434E;--red-dk:#AA1620;--gold:#F0B90B;--gold-dk:#C99A08;
  --body:#242220;--muted:#726C63;--white:#FFFFFF;--ok:#1F8A4C;
  --ff-display:'Space Grotesk',sans-serif;--ff-body:'Inter',sans-serif;--ff-mono:'IBM Plex Mono',monospace;
  --r:12px;--shadow-sm:0 2px 10px rgba(10,10,10,.07);--shadow-md:0 14px 34px rgba(10,10,10,.12);--shadow-lg:0 30px 64px rgba(10,10,10,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a,button,input,select,textarea,label{-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:12px}
.btn:focus-visible,.pill-btn:focus-visible,.circle:focus-visible,.heart:focus-visible,.badge:focus-visible{border-radius:99px}
button,.btn,a.row,.lcard,.stat,.card,.pbar a,.tabbar a,.mobile-menu a,.nav-links a{border-radius:inherit}
body{font-family:var(--ff-body);color:var(--body);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,h4{font-family:var(--ff-display);color:var(--ink);line-height:1.12;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,4.6vw,3.7rem)}h2{font-size:clamp(1.7rem,3vw,2.4rem)}h3{font-size:1.2rem}
.red{color:var(--red)}
.wrap{max-width:1200px;margin:0 auto;padding:0 1.25rem;width:100%}
main{flex:1}

/* nav: floating pill */
.nav{position:fixed;top:14px;left:14px;right:14px;z-index:50;max-width:1240px;margin:0 auto;background:rgba(10,10,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:99px;padding:.55rem .7rem .55rem 1.2rem;display:flex;align-items:center;gap:1rem;box-shadow:var(--shadow-md)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--ff-display);font-weight:700;font-size:1.05rem;color:#fff;white-space:nowrap}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--red);font-size:.9rem;font-style:normal}
.logo b{color:var(--red-lt)}
.nav-links{display:flex;gap:.3rem;margin:0 auto}
.nav-links a{font-family:var(--ff-mono);font-size:.8rem;font-weight:500;color:#ddd;padding:.5rem .95rem;border-radius:99px;transition:.2s}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav-links a.on{background:var(--red-lt);color:#fff}
.nav-right{display:flex;align-items:center;gap:.5rem}
.pill-btn{font-family:var(--ff-mono);font-size:.8rem;font-weight:600;color:#fff;border:1.5px solid rgba(255,255,255,.55);padding:.5rem 1.1rem;border-radius:99px;display:inline-flex;align-items:center;gap:.4rem;transition:.2s}
.pill-btn:hover{background:#fff;color:var(--ink)}
.circle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;border:1.5px solid rgba(255,255,255,.4);position:relative;transition:.2s}
.circle:hover{background:#fff;color:var(--ink)}
.circle.red{background:var(--red);border-color:var(--red)}
.circle .dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--ink);font-size:.65rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.burger{display:none}
.mobile-menu{display:none}
@media(max-width:900px){
  .nav-links{display:none}.burger{display:grid}.nav{padding-left:1rem}.nav-right{margin-left:auto}
  .hide-m{display:none!important}
  .mobile-menu.open{display:flex;flex-direction:column;position:fixed;top:78px;left:14px;right:14px;z-index:49;background:#fff;border-radius:22px;padding:.6rem;box-shadow:var(--shadow-lg)}
  .mobile-menu a{padding:.9rem 1rem;border-radius:12px;font-family:var(--ff-mono);font-weight:500;font-size:.9rem}
  .mobile-menu a:hover,.mobile-menu a.on{background:var(--parch)}
}

/* buttons */
.btn{font-family:var(--ff-mono);font-weight:700;font-size:.86rem;padding:.75rem 1.5rem;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:2px solid var(--ink);transition:all .25s ease;line-height:1.2}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--red);border-color:var(--red);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.btn-outline{background:transparent;color:var(--ink)}
.btn-outline:hover{background:var(--ink);color:#fff;transform:translateY(-3px)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--red-dk);border-color:var(--red-dk);transform:translateY(-3px)}
.btn-sm{padding:.5rem 1rem;font-size:.78rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.eyebrow{display:flex;align-items:center;gap:.75rem;font-family:var(--ff-mono);font-size:.74rem;font-weight:600;letter-spacing:.1em;color:var(--red-dk);margin-bottom:1.1rem}
.eyebrow:before{content:"";width:28px;height:1.5px;background:var(--red-dk)}

/* hero */
.hero{padding:120px 0 60px;background:radial-gradient(ellipse 60% 55% at 88% 10%,rgba(255,49,49,.09),transparent),radial-gradient(ellipse 55% 60% at 8% 95%,rgba(255,204,0,.14),transparent),var(--paper)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}
.hero p.lead{font-size:1.08rem;color:var(--muted);margin:1.3rem 0 1.8rem;max-width:560px}
.hero-ctas{display:flex;gap:.8rem;flex-wrap:wrap}
.hero-art{position:relative;aspect-ratio:4/3.5;max-width:460px;width:100%;justify-self:end;border-radius:28px;background:linear-gradient(140deg,var(--ink) 0%,#2a1215 100%);overflow:hidden;box-shadow:var(--shadow-lg);display:grid;place-items:center;color:#fff}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-art .ph{font-size:5rem;color:rgba(255,255,255,.18)}
.hero-art .tag{position:absolute;background:#fff;color:var(--ink);font-family:var(--ff-mono);font-weight:600;font-size:.8rem;padding:.55rem .9rem;border-radius:14px;box-shadow:var(--shadow-md);display:flex;gap:.5rem;align-items:center}
.hero-art .tag i{color:var(--red)}
.stats{display:flex;gap:2.2rem;margin-top:2.4rem;padding-top:1.6rem;border-top:1px solid var(--line);flex-wrap:wrap}
.stats b{display:block;font-family:var(--ff-display);font-size:1.9rem;color:var(--ink);line-height:1}
.stats span{font-size:.82rem;color:var(--muted)}
@media(max-width:900px){.hero{padding-top:100px}.hero-grid{grid-template-columns:1fr}.hero-art{aspect-ratio:16/10}}

/* search card */
.searchbar{background:#fff;border:1px solid var(--line);border-radius:22px;padding:1rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--shadow-sm);margin-top:-30px;position:relative;z-index:2}
.searchbar label{flex:1;min-width:150px;font-family:var(--ff-mono);font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.searchbar select,.searchbar input{display:block;width:100%;margin-top:.3rem}

/* sections */
.section{padding:3rem 0}
.section.alt{background:var(--parch)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.section-head p{color:var(--muted);margin-top:.5rem;max-width:560px}
.grid{display:grid;gap:1.4rem}
.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid.c3,.grid.c4,.grid.c2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.6rem;transition:.25s}
.card.hov:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.card .ico{width:46px;height:46px;border-radius:12px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-size:1.1rem;margin-bottom:1rem}
.card h3{margin-bottom:.5rem}.card p{color:var(--muted);font-size:.95rem}

/* listing cards */
.lcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:.25s;display:block}
.lcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-md)}
.lcard .pic{aspect-ratio:1/.82;background:linear-gradient(140deg,var(--ink),#2a1215);display:grid;place-items:center;color:rgba(255,255,255,.25);font-size:2.6rem;position:relative}
.lcard .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lcard .body{padding:.65rem .8rem .8rem}
.lcard .city{font-family:var(--ff-mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red-dk)}
.lcard h3{font-size:.92rem;margin:.15rem 0 .25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .price{font-family:var(--ff-display);font-size:1rem;font-weight:700;color:var(--ink)}
.lcard .price small{font-family:var(--ff-body);font-weight:400;color:var(--muted);font-size:.8rem}
.lcard .free{font-size:.82rem;color:var(--ok);font-weight:600}
.heart{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(10,10,10,.55);color:#fff;display:grid;place-items:center;transition:.2s}
.heart:hover{transform:scale(1.1)}.heart.on{background:#fff;color:var(--red)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:2rem;color:var(--muted);text-align:center}

/* detail */
.detail{padding-top:100px;max-width:760px;margin:0 auto}
.gallery{border-radius:20px;overflow:hidden;background:linear-gradient(140deg,var(--ink),#2a1215);aspect-ratio:16/9;max-height:340px;width:100%;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.2);font-size:4rem}
.gallery img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:.5rem;margin-top:.6rem;overflow-x:auto}
.thumbs img{width:84px;height:62px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent;flex:none}
.thumbs img.on{border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:#fff;border:1px solid var(--line);border-radius:99px;padding:.35rem .85rem;font-size:.85rem}
.chip i{color:var(--ok)}
.notice{display:flex;gap:.7rem;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:1rem;font-size:.9rem;margin:1.5rem 0}

/* forms */
input,select,textarea{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:.75rem 1rem;color:var(--body);width:100%;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
label.f{display:block;font-size:.85rem;font-weight:600;margin-bottom:.9rem;color:var(--ink)}
label.f input,label.f select,label.f textarea{margin-top:.35rem;font-weight:400}
.formbox{max-width:440px;margin:0 auto;padding-top:120px}
.formbox .card{padding:1.8rem}
.err{background:rgba(217,30,43,.08);color:var(--red-dk);border-radius:10px;padding:.7rem 1rem;font-size:.88rem;margin-bottom:1rem}
.okmsg{background:rgba(31,138,76,.1);color:var(--ok);border-radius:10px;padding:.7rem 1rem;font-size:.88rem;margin-bottom:1rem}

/* page head (inner pages) */
.page{padding-top:110px;padding-bottom:3rem}
.page h1{font-size:clamp(1.9rem,3.4vw,2.8rem);margin-bottom:.5rem}
.sub{color:var(--muted);margin-bottom:1.6rem}

/* chat */
.chat{max-width:700px}
.bubbles{display:flex;flex-direction:column;gap:.5rem;min-height:40vh;margin-bottom:1rem}
.b{max-width:82%;padding:.7rem 1rem;border-radius:18px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}
.b small{display:block;font-size:.7rem;opacity:.65;margin-top:.25rem}
.b .who{font-family:var(--ff-mono);font-size:.68rem;color:var(--red);font-weight:600;display:block;margin-bottom:.15rem}
.chatform{display:flex;gap:.5rem}

/* footer */
footer{background:var(--ink);color:#bdb8ae;padding:3.5rem 0 1.5rem;margin-top:3rem}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem}
footer h4{color:#fff;font-size:1rem;margin-bottom:.9rem}
footer a{display:block;padding:.2rem 0;font-size:.9rem}footer a:hover{color:var(--gold)}
footer .bottom{border-top:1px solid #2a2a2a;margin-top:2.2rem;padding-top:1.2rem;font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
footer .logo{margin-bottom:1rem}
footer .logo b{color:var(--gold)}
@media(max-width:760px){footer .cols{grid-template-columns:1fr 1fr}}

/* floating bits */
.langfab{position:fixed;left:16px;bottom:16px;z-index:40;background:var(--ink);color:#fff;border-radius:99px;padding:.55rem 1rem;font-family:var(--ff-mono);font-size:.78rem;font-weight:600;display:flex;gap:.7rem;align-items:center;box-shadow:var(--shadow-md)}
.langfab button{color:#888;font-weight:600}.langfab button.on{color:#fff}
.cookie{position:fixed;left:16px;right:16px;bottom:70px;max-width:440px;z-index:60;background:#fff;border-radius:18px;padding:1.1rem 1.2rem;box-shadow:var(--shadow-lg);border:1px solid var(--line);display:none}
.cookie.show{display:block}.cookie p{font-size:.88rem;color:var(--muted);margin:.3rem 0 .8rem}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:99px;font-size:.88rem;z-index:100;transition:.3s;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--red-dk)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--parch),#f3f0e8,var(--parch));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;min-height:160px}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:fd .25s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- office portal ---------- */
.pbar{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1.6rem}
.pbar a{font-family:var(--ff-mono);font-size:.8rem;font-weight:600;padding:.5rem 1rem;border-radius:99px;border:1.5px solid var(--line);background:#fff}
.pbar a.on,.pbar a:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.2rem}
.stat b{display:block;font-family:var(--ff-display);font-size:2rem;color:var(--ink)}.stat span{color:var(--muted);font-size:.88rem}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:.92rem}
.tbl th{text-align:left;font-family:var(--ff-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:.8rem 1rem;background:var(--parch)}
.tbl td{padding:.8rem 1rem;border-top:1px solid var(--line)}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>*{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.1rem;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
a.row:hover{background:var(--parch)}
.badge{font-family:var(--ff-mono);font-size:.7rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:.2rem .7rem;white-space:nowrap;background:#fff}
.badge.green{background:rgba(31,138,76,.1);color:var(--ok);border-color:transparent}
.badge.red{background:rgba(217,30,43,.1);color:var(--red-dk);border-color:transparent}
.badge.gold{background:rgba(240,185,11,.2);color:#7a5a00;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.inline{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.inline input,.inline select{width:auto;flex:1;min-width:110px}
.backlink{font-family:var(--ff-mono);font-size:.8rem;color:var(--muted);display:inline-block;margin-bottom:.8rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5rem;margin:.8rem 0}
.photos .p{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--parch)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .p .acts{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;padding:.15rem .4rem}
/* inspection (tablet friendly: big touch targets) */
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.8rem}
.item p.q{font-weight:600;margin-bottom:.6rem}
.seg{display:flex;gap:.5rem}
.seg button{flex:1;min-height:48px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;background:#fff}
.seg button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.defect.on{background:var(--red);border-color:var(--red);color:#fff}
.seg button.na.on{background:var(--muted);border-color:var(--muted);color:#fff}
.seg button.sev.on{border-color:var(--red);color:var(--red)}
.addphoto{display:inline-flex;align-items:center;gap:.4rem;min-height:48px;padding:0 1rem;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer;font-size:.9rem;margin-top:.6rem}
.addphoto input{display:none}
.progress{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:.7rem 1.2rem;z-index:45;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.sigpad{width:100%;height:170px;border:1.5px solid var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}
.hl{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;margin-bottom:1rem}

/* phone tab bar (Home / Messages / Saved / Profile) */
.tabbar{display:none}
@media(max-width:900px){
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:12px;right:12px;bottom:12px;z-index:48;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:.35rem;box-shadow:var(--shadow-lg)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0;border-radius:20px;color:#c8c3b8;font-family:var(--ff-mono);font-size:.66rem;font-weight:600}
  .tabbar a i{font-size:1.1rem}
  .tabbar a.on{background:var(--red);color:#fff}
  body{padding-bottom:84px}
  .langfab{bottom:auto;top:84px;left:auto;right:14px;padding:.4rem .8rem;font-size:.7rem}
  .cookie{bottom:90px}
  .progress{bottom:0}
}

/* small cards: horizontal scroller on home, compact grid elsewhere */
.cw{position:relative}
.lrow{display:flex;gap:.9rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.2rem 1.25rem 1rem;margin:0 -1.25rem;scrollbar-width:none}
.lrow::-webkit-scrollbar{display:none}
.lrow>.cw{flex:0 0 172px;scroll-snap-align:start}

@media(max-width:900px){
  .tabbar{--i:0;position:fixed;isolation:isolate;padding:.3rem}
  .tabbar::before{content:"";position:absolute;z-index:-1;top:.3rem;bottom:.3rem;left:.3rem;width:calc((100% - .6rem)/4);border-radius:20px;background:linear-gradient(140deg,var(--red-lt),var(--red-dk));box-shadow:0 6px 18px rgba(217,30,43,.45);transform:translateX(calc(var(--i)*100%));transition:transform .45s cubic-bezier(.34,1.45,.5,1),opacity .2s}
  .tabbar.none::before{opacity:0}
  .tabbar a{position:relative;background:none!important;transition:color .25s,transform .15s}
  .tabbar a:active{transform:scale(.9)}
  .tabbar a i{transition:transform .4s cubic-bezier(.34,1.6,.5,1)}
  .tabbar a span{transition:transform .3s,opacity .3s;opacity:.85}
  .tabbar a.on{color:#fff}
  .tabbar a.on i{animation:tabpop .5s cubic-bezier(.34,1.6,.5,1) both;transform:translateY(-2px) scale(1.18)}
  .tabbar a.on span{opacity:1;transform:translateY(-1px)}
  @keyframes tabpop{0%{transform:translateY(6px) scale(.7)}60%{transform:translateY(-6px) scale(1.3)}100%{transform:translateY(-2px) scale(1.18)}}
}
@media(prefers-reduced-motion:reduce){.tabbar::before,.tabbar a i{transition:none!important;animation:none!important}}
html,body{max-width:100%;overflow-x:hidden}

  .tabbar a.on span{transform:translateY(-12px);color:var(--red-dk);font-weight:700}
  @keyframes tabrise{0%{transform:translateY(0) scale(.8)}60%{transform:translateY(-22px) scale(1.18)}100%{transform:translateY(-17px) scale(1.08)}}
  .cookie{bottom:92px}.reqbar{bottom:92px}
}
@media(max-width:900px){.tabbar{background:#fff}.tabbar a.on span{transform:none;color:var(--red)}.tabbar a{padding-top:.7rem}}

  function privacy(de) {

        "<h2>Datenübermittlung in Drittländer</h2><p>Unsere Datenbank liegt in der EU (Frankfurt am Main). Einzelne Dienstleister (z. B. Netlify, Cloudflare, Google) haben ihren Sitz in den USA oder betreiben dort Infrastruktur. Soweit Daten dorthin übermittelt werden, stützen wir uns auf einen Angemessenheitsbeschluss der EU-Kommission (EU-US Data Privacy Framework) oder auf Standardvertragsklauseln (Art. 44 ff. DSGVO). Wenn unsere Mitarbeiter von außerhalb der EU auf Daten zugreifen, geschieht dies nur mit geeigneten Garantien nach Kapitel V DSGVO.</p>" +
        "<h2>Löschung und Datenexport</h2><p>Sie können jederzeit die Löschung Ihres Kontos oder eine Kopie Ihrer Daten in einem gängigen maschinenlesbaren Format verlangen (E-Mail an die im Impressum genannte Adresse). Wir prüfen vorher Ihre Identität und beantworten Anfragen in der Regel innerhalb eines Monats kostenlos. Bei der Löschung werden Ihre Angaben im Konto entfernt oder anonymisiert; Daten, die wir gesetzlich aufbewahren müssen, bleiben bis zum Ablauf der Fristen gesperrt gespeichert.</p>" +
        "<h2>Minderjährige</h2><p>Unser Angebot richtet sich an Volljährige. Wir erheben wissentlich keine Daten von Minderjährigen.</p>",
      en: "<h2>Legal bases at a glance</h2>" + lis(["Account, requests, messages, tenancy: performance of a contract or pre-contractual steps (Art. 6(1)(b) GDPR).", "Security, troubleshooting, delivering the website, proof of the condition of the apartment: legitimate interest (Art. 6(1)(f) GDPR).", "Keeping booking and payment records: legal obligation (Art. 6(1)(c) GDPR).", "Technically necessary local storage: § 25 (2) no. 2 TDDDG."]) +
        "<h2>Disclosure to authorities</h2><p>We disclose personal data to courts, authorities or other bodies only where we are legally obliged to (for example under a court order, a reporting duty or to avert an imminent danger), or where it is necessary to enforce our own legal claims.</p>" +
        "<h2>Transfers to third countries</h2><p>Our database is located in the EU (Frankfurt am Main). Some service providers (for example Netlify, Cloudflare, Google) are based in the USA or run infrastructure there. Where data is transferred there, we rely on an adequacy decision of the European Commission (EU-US Data Privacy Framework) or on standard contractual clauses (Art. 44 et seq. GDPR). If our staff access data from outside the EU, this happens only with suitable safeguards under Chapter V GDPR.</p>" +
        "<h2>Deletion and data export</h2><p>You can ask at any time for your account to be deleted or for a copy of your data in a common machine-readable format (email to the address given in the imprint). We verify your identity first and normally answer free of charge within one month. On deletion, your account details are removed or anonymised; data we must keep by law stays blocked until the retention periods end.</p>" +
        "<h2>Minors</h2><p>Our service is aimed at adults. We do not knowingly collect data from minors.</p>"
    },
    terms: {
      de: "<h2>Unsere Rolle</h2><p>Wir mieten ganze Wohnungen an, richten sie her und vermieten einzelne Zimmer und Betten selbst unter. Ihr Vertragspartner ist daher grundsätzlich wir und nicht der Eigentümer der Wohnung. Wir sind keine Vermittlungsplattform für fremde Angebote.</p>" +
        "<h2>Zustand der Zimmer und Mängel</h2><p>Fotos und Beschreibungen auf der Website sind möglichst genau, können aber leicht abweichen (z. B. Möblierung, Lichtverhältnisse). Maßgeblich ist der im Übergabeprotokoll festgehaltene Zustand. Mängel melden Sie uns bitte unverzüglich in Textform (z. B. per Nachricht im Konto oder E-Mail), damit wir sie beheben können.</p>" +
        "<h2>Hausordnung und Verhalten</h2><p>Bitte nehmen Sie Rücksicht auf Mitbewohner und Nachbarn, halten Sie die vereinbarte Belegung ein und überlassen Sie das Zimmer nicht ohne unsere Zustimmung Dritten. Diskriminierung, Belästigung und Bedrohung anderer Nutzer oder Mitarbeiter sind nicht erlaubt. Für Schäden, die Sie schuldhaft verursachen, haften Sie nach den gesetzlichen Regeln und dem Untermietvertrag.</p>" +
        "<h2>Digitale Unterschrift</h2><p>Übergabeprotokolle werden auf einem Gerät digital unterschrieben. Nach der Unterschrift ist das Protokoll gesperrt; zusätzlich wird eine Prüfsumme gespeichert, damit nachträgliche Änderungen auffallen. Es handelt sich um eine einfache elektronische Unterschrift. Mit der Nutzung erklären Sie sich damit einverstanden, dass Protokolle in dieser Form erstellt werden; auf Wunsch erhalten Sie eine Kopie als PDF.</p>" +
        "<h2>Anmeldung der Wohnung</h2><p>Für die Anmeldung beim Einwohnermeldeamt stellen wir Ihnen die erforderliche Wohnungsgeberbestätigung innerhalb der gesetzlichen Frist aus.</p>" +
        "<h2>Kaution und Kündigung</h2><p>Höhe der Kaution, Zahlungsweise, Laufzeit und Kündigungsfristen ergeben sich aus dem Untermietvertrag und den gesetzlichen Vorschriften. Die Kaution wird nach Rückgabe des Zimmers und Klärung etwaiger Ansprüche zurückgezahlt.</p>" +
        "<h2>Sperrung von Konten</h2><p>Bei Missbrauch, falschen Angaben oder Verstößen gegen diese Bedingungen können wir ein Konto sperren oder löschen. Gesetzliche Rechte aus einem laufenden Mietverhältnis bleiben davon unberührt.</p>" +
        "<h2>Elektronische Kommunikation</h2><p>Wir dürfen Ihnen Mitteilungen zum Konto und zur Anfrage per E-Mail oder als Nachricht im Konto senden. Erklärungen, die Form- oder Fristvorgaben unterliegen (z. B. eine Kündigung), richten sich nach dem Untermietvertrag.</p>" +
        "<h2>Höhere Gewalt</h2><p>Für Leistungsstörungen durch Ereignisse außerhalb unseres Einflusses (z. B. Naturereignisse, behördliche Anordnungen, großflächige Ausfälle von Strom oder Internet) haften wir nur im gesetzlichen Rahmen.</p>" +
        "<h2>Änderung dieser Bedingungen</h2><p>Wir können diese Bedingungen für die Nutzung der Website ändern, wenn es dafür einen sachlichen Grund gibt. Über wesentliche Änderungen informieren wir Sie vorab per E-Mail oder im Konto. Bestehende Untermietverträge bleiben davon unberührt.</p>",
      en: "<h2>Our role</h2><p>We rent whole apartments, prepare them and sublet individual rooms and beds ourselves. Your contract partner is therefore us and not the owner of the apartment. We are not a marketplace for third-party listings.</p>" +
        "<h2>Condition of rooms and defects</h2><p>Photos and descriptions on the website are as accurate as possible but may differ slightly (for example furnishing, lighting). The condition recorded in the handover protocol is decisive. Please report defects to us without delay in text form (for example by message in your account or by email) so that we can fix them.</p>" +
        "<h2>House rules and conduct</h2><p>Please be considerate of housemates and neighbours, keep to the agreed occupancy and do not let a third party use the room without our consent. Discrimination, harassment and threats towards other users or staff are not allowed. You are liable for damage you cause through fault under the statutory rules and the sublease agreement.</p>" +
        "<h2>Digital signature</h2><p>Handover protocols are signed digitally on a device. Once signed, the protocol is locked; a checksum is also stored so that later changes become visible. This is a simple electronic signature. By using the service you agree that protocols are created in this form; on request you receive a copy as a PDF.</p>" +
        "<h2>Registering your address</h2><p>For registration at the residents’ registration office we give you the required landlord confirmation (Wohnungsgeberbestätigung) within the statutory period.</p>" +
        "<h2>Deposit and termination</h2><p>The amount of the deposit, how it is paid, the term and notice periods follow from the sublease agreement and the statutory rules. The deposit is repaid after the room is returned and any claims are settled.</p>" +
        "<h2>Account suspension</h2><p>In case of misuse, false information or breach of these terms we may suspend or delete an account. Statutory rights under an existing tenancy remain unaffected.</p>" +
        "<h2>Electronic communication</h2><p>We may send you notices about your account and request by email or as a message in your account. Declarations that are subject to form or deadline requirements (for example a termination) follow the sublease agreement.</p>" +
        "<h2>Force majeure</h2><p>We are liable for disruptions caused by events beyond our control (for example natural events, orders by authorities, large-scale power or internet outages) only within the statutory limits.</p>" +
        "<h2>Changes to these terms</h2><p>We may change these terms for using the website if there is a good reason. We will tell you in advance of material changes by email or in your account. Existing sublease agreements are not affected.</p>"
    }
  };

        cityNames.forEach(function (c) {
          var rows = cities[c].filter(function (l) { return l.free > 0; });
          if (!rows.length) return;
          h += rowHead(tr("Rooms in ", "Zimmer in ") + esc(c), tr("Close to universities and clinics.", "In der Nähe von Hochschulen und Kliniken."), "#/rooms?city=" + encodeURIComponent(c)) +
            '<div class="lrow">' + rows.slice(0, 8).map(card).join("") + seeAllTile("#/rooms?city=" + encodeURIComponent(c), tr("Rooms in ", "Zimmer in ") + c) + "</div>";
        });
      }
      h += "</div>";
      // standard tab
      h += '<div class="tabpane" id="tab-standard" hidden><div class="promo"><span class="pill"><i class="fa-solid fa-shield-halved"></i> ' + tr("Inspected before you move in", "Geprüft vor Ihrem Einzug") + "</span><h2>" + t("site.whyTitle") + "</h2><p>" + t("site.heroText") + '</p><a class="btn btn-primary btn-sm" href="#/quality">' + tr("See how we inspect", "So prüfen wir") + "</a></div>" +
        '<div class="grid c3">' + [["clipboard-check", "why1"], ["file-shield", "why2"], ["comments", "why3"]].map(function (x) { return '<div class="card hov"><div class="ico"><i class="fa-solid fa-' + x[0] + '"></i></div><h3>' + t("site." + x[1] + "t") + "</h3><p>" + t("site." + x[1]) + "</p></div>"; }).join("") + "</div></div>";
      // how tab
      h += '<div class="tabpane" id="tab-how" hidden><div class="grid c3">' + [["magnifying-glass", "how1"], ["paper-plane", "how2"], ["file-signature", "how3"]].map(function (x) { return '<div class="card hov"><div class="ico"><i class="fa-solid fa-' + x[0] + '"></i></div><h3>' + t("site." + x[1] + "t") + "</h3><p>" + t("site." + x[1]) + "</p></div>"; }).join("") + '</div><div style="text-align:center;margin-top:1.2rem"><a class="btn btn-red" href="#/signup">' + t("site.ctaBandBtn") + "</a></div></div>";
      h += "</div>";
      $app.html(h);
      $(".tabs2 button").on("click", function () {
        var k = $(this).data("tab");
        $(".tabs2 button").removeClass("on"); $(this).addClass("on");
        $(".tabpane").prop("hidden", true); $("#tab-" + k).prop("hidden", false);
      });
    });
  }

  function pageRooms(p, q) {
    withListings(function (L) {
      var cities = {}; L.forEach(function (l) { cities[l.city] = 1; });
      var list = L.filter(function (l) {
        if (l.free < 1) return false;
        if (q.city && l.city.toLowerCase() !== q.city.toLowerCase()) return false;
        if (q.max && (l.price == null || l.price > Number(q.max) * 100)) return false;
        return true;
      });
      var h = '<div class="wrap page fade"><h1>' + t("site.navRooms") + '</h1><form class="searchbar" style="margin:1rem 0 1.6rem" id="sform"><label>' + t("site.searchCity") + '<select name="city"><option value="">' + t("site.anyCity") + "</option>" +
        Object.keys(cities).sort().map(function (c) { return "<option" + (q.city === c ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") + "</select></label><label>" + t("site.searchBudget") +
        '<input name="max" type="number" min="0" step="10" value="' + esc(q.max || "") + '"></label><button class="btn btn-red" type="submit">' + t("site.searchGo") + '</button><a class="btn btn-outline" href="#/rooms">' + t("site.reset") + "</a></form>" +
        '<p class="sub">' + t("site.resultsN", { n: list.length }) + "</p>" +
        (list.length ? '<div class="lgrid">' + list.map(card).join("") + "</div>" : '<div class="empty">' + t("site.noMatch") + "</div>") + "</div>";
      $app.html(h);
      $("#sform").on("submit", function (e) {
        e.preventDefault(); var qs = [];
        if (this.city.value) qs.push("city=" + encodeURIComponent(this.city.value)); if (this.max.value) qs.push("max=" + encodeURIComponent(this.max.value));
        location.hash = "#/rooms" + (qs.length ? "?" + qs.join("&") : "");
      });
    });
  }

  function pageRoom(p) {
    withListings(function (L) {
      var l = L.filter(function (x) { return x.id === p.id; })[0];
      if (!l) { $app.html('<div class="wrap page"><div class="empty">' + t("site.notFound") + "</div></div>"); return; }
      var on = saved.has(l.id);
      function spec(icon, label, val) { return '<div class="spec"><i class="fa-solid fa-' + icon + '"></i><span>' + label + "</span><b>" + val + "</b></div>"; }
      var h = '<div class="wrap detail fade"><div class="rd">' +
        '<div class="rd-media"><div class="gallery" id="gal">' + (l.photos[0] ? '<img src="' + esc(l.photos[0]) + '" alt="">' : '<i class="fa-solid fa-bed"></i>') +
        '<button class="gbtn back" id="rback" aria-label="' + t("site.back") + '"><i class="fa-solid fa-arrow-left"></i></button>' +
        '<button class="heart gbtn' + (on ? " on" : "") + '" data-id="' + l.id + '" aria-label="Save"><i class="fa-' + (on ? "solid" : "regular") + ' fa-heart"></i></button></div>' +
        (l.photos.length > 1 ? '<div class="thumbs">' + l.photos.map(function (u, i) { return '<img src="' + esc(u) + '" class="' + (i === 0 ? "on" : "") + '" alt="">'; }).join("") + "</div>" : "") + "</div>" +
        '<div class="rd-info"><div class="metaline"><span class="pill"><i class="fa-solid fa-location-dot"></i>' + esc(l.city) + (l.district ? " · " + esc(l.district) : "") + '</span><span class="pill warm"><i class="fa-solid fa-shield-halved"></i>' + tr("Inspected", "Geprüft") + "</span></div>" +
        "<h1>" + esc(l.title) + "</h1>" +
        '<p class="rent"><b>' + (l.price != null ? eur(l.price) : "–") + "</b> <span>" + t("site.perMonth") + "</span></p>" +
        '<div class="specs">' +
        spec("bed", tr("Free beds", "Freie Betten"), l.free) +
        spec("calendar", tr("Available", "Verfügbar"), l.from ? fmtDate(l.from) : tr("Now", "Sofort")) +
        (l.size ? spec("ruler-combined", tr("Size", "Größe"), esc(l.size) + " m²") : "") +
        spec("couch", tr("Type", "Art"), tr("Furnished", "Möbliert")) + "</div>" +
        (l.description ? "<h3>" + t("site.about") + '</h3><p class="desc">' + esc(l.description) + "</p>" : "") +
        (l.amenities.length ? "<h3>" + t("site.amenities") + '</h3><div class="chips">' + l.amenities.map(function (a) { return '<span class="chip"><i class="fa-solid fa-check"></i>' + esc(a) + "</span>"; }).join("") + "</div>" : "") +
        '<div class="listbox"><i class="fa-solid fa-clipboard-check"></i><div><b>' + tr("Checked before move-in", "Geprüft vor dem Einzug") + "</b><small>" + tr("Condition, photos and meter readings are recorded in a signed protocol.", "Zustand, Fotos und Zählerstände werden in einem unterschriebenen Protokoll festgehalten.") + "</small></div></div>" +
        '<div class="notice"><i class="fa-solid fa-lock" style="color:var(--red);margin-top:3px"></i><span>' + t("site.privacy") + "</span></div>" +
        "</div></div></div>" +
        '<div class="reqbar"><div><b>' + (l.price != null ? eur(l.price) : "–") + "</b><small>" + t("site.perMonth") + '</small></div><button class="btn btn-red" id="reqbtn">' + t("site.request") + "</button></div>";
      $app.html(h);
      getMe().then(function (me) { if (!me) $("#reqbtn").text(t("site.requestLogin")); });
      $("#rback").on("click", function () { if (history.length > 1) history.back(); else location.hash = "#/rooms"; });
      $(".thumbs img").on("click", function () { $(".thumbs img").removeClass("on"); $(this).addClass("on"); $("#gal > img").attr("src", $(this).attr("src")); });
      $("#reqbtn").on("click", function () {
        var $b = $(this);
        getMe().then(function (me) {
          if (!me) { location.hash = "#/login"; return; }
          $b.prop("disabled", true).text(t("site.sending"));
          myCandidateId(me).then(function (cid) {
            if (!cid) { toast(t("site.error"), true); $b.prop("disabled", false).text(t("site.request")); return; }
            sb.from("messages").insert({ candidate_id: cid, sender_role: "candidate", sender_id: me.id, body: t("site.interested", { title: l.title }), listing_id: l.id }).then(function (r) {
              if (r.error) { toast(t("site.error"), true); $b.prop("disabled", false).text(t("site.request")); return; }
              toast(t("site.sent")); location.hash = "#/messages";
            });
          });
        });
      });
    });
  }

  function pageSaved() {
    getMe().then(function (me) {
      if (!me) { $app.html(gate(t("site.saved"), t("site.gateSaved"), t("site.gateSavedText"))); return; }
      var draw = function () {
        withListings(function (L) {
          var list = L.filter(function (l) { return saved.has(l.id); });
          $app.html('<div class="wrap page fade"><h1>' + t("site.saved") + "</h1><p class='sub'></p>" + (list.length ? '<div class="lgrid">' + list.map(card).join("") + "</div>" : '<div class="empty">' + t("site.savedEmpty") + "</div>") + "</div>");
        });
      };
      if (savedLoaded) draw(); else loadSaved().then(draw);
    });
  }

  function pageMessages() {
    getMe().then(function (me) {
      if (!me) { $app.html(gate(t("site.messages"), t("site.gateMessages"), t("site.gateMessagesText"))); return; }
      $app.html('<div class="wrap page fade"><h1>' + t("site.messages") + '</h1><div class="chat"><div class="bubbles" id="bub"><div class="skel"></div></div><form class="chatform" id="cf"><input id="ci" maxlength="2000" autocomplete="off" placeholder="' + t("site.chatPlaceholder") + '"><button class="btn btn-red" style="flex:none">' + t("site.chatSend") + "</button></form></div></div>");
      var lastN = -1;
      function load() {
        sb.from("messages").select("id, sender_role, body, created_at").order("created_at").then(function (r) {
          var rows = r.data || [];
          if (rows.length !== lastN) {
            lastN = rows.length;
            $("#bub").html(rows.length ? rows.map(function (m) {
              var mine = m.sender_role === "candidate";
              return '<div class="b' + (mine ? " me" : "") + '">' + (mine ? "" : '<span class="who">' + t("site.chatTeam") + "</span>") + esc(m.body) + "<small>" + fmtDate(m.created_at, true) + "</small></div>";
            }).join("") : '<div class="empty">' + t("site.chatEmpty") + "</div>");
            window.scrollTo(0, document.body.scrollHeight);
          }
          if (rows.some(function (m) { return m.sender_role === "staff"; })) sb.from("messages").update({ read_at: new Date().toISOString() }).eq("sender_role", "staff").is("read_at", null).then(function () {});
        });
      }
      load(); timers.push(setInterval(load, 8000)); // new replies show up without reloading
      $("#cf").on("submit", function (e) {
        e.preventDefault();
        var body = $("#ci").val().trim(); if (!body) return;
        $("#cf button").prop("disabled", true);
        myCandidateId(me).then(function (cid) {
          if (!cid) return;
          sb.from("messages").insert({ candidate_id: cid, sender_role: "candidate", sender_id: me.id, body: body }).then(function (r) {
            $("#cf button").prop("disabled", false);
            if (r.error) { toast(t("site.error"), true); return; }
            $("#ci").val(""); lastN = -1; load();
          });
        });
      });
    });
  }

  function pageNotifications() {
    getMe().then(function (me) {
      if (!me) { $app.html(gate(t("site.notifTitle"), t("site.gateMessages"), t("site.gateMessagesText"))); return; }
      sb.from("notifications").select("id, title, body, link, read_at, created_at").order("created_at", { ascending: false }).limit(50).then(function (r) {
        var rows = r.data || [];
        $app.html('<div class="wrap page fade"><h1>' + t("site.notifTitle") + "</h1><br>" + (rows.length ? '<div class="grid" style="max-width:640px">' + rows.map(function (n) {
          return '<a class="card" style="padding:1rem;' + (n.read_at ? "" : "border-color:var(--red)") + '" href="' + (n.link ? "#" + esc(n.link) : "#/notifications") + '"><b>' + esc(n.title) + "</b><p style='font-size:.9rem'>" + esc(n.body || "") + "</p><small style='color:var(--muted)'>" + fmtDate(n.created_at, true) + "</small></a>";
        }).join("") + "</div>" : '<div class="empty">' + t("site.notifEmpty") + "</div>") + "</div>");
        if (rows.some(function (n) { return !n.read_at; })) sb.from("notifications").update({ read_at: new Date().toISOString() }).is("read_at", null).then(function () {});
      });
    });
  }

  function pageQuality() {
    withListings(function (L) {
      var beds = 0, cities = {}; L.forEach(function (l) { beds += l.free; cities[l.city] = 1; });
      $app.html('<div class="wrap page fade"><div class="eyebrow">' + t("site.navQuality").toUpperCase() + "</div><h1>" + t("site.qHeading") + '</h1><p class="sub" style="max-width:640px;margin-top:.8rem">' + t("site.qText") + "</p>" +
        '<div class="grid c3" style="margin:1.5rem 0"><div class="stat"><b>' + L.length + "</b><span>" + t("site.statRooms") + '</span></div><div class="stat"><b>' + beds + "</b><span>" + t("site.statBeds") + '</span></div><div class="stat"><b>' + Object.keys(cities).length + "</b><span>" + t("site.statCities") + "</span></div></div>" +
        "<h3>" + t("site.qChecklist") + '</h3><div class="grid c2" style="margin-top:1rem">' + t("site.qItems").map(function (x) { return '<div class="chip" style="border-radius:14px;padding:.8rem 1rem"><i class="fa-solid fa-circle-check"></i>' + esc(x) + "</div>"; }).join("") + '</div><div class="notice"><i class="fa-solid fa-lock" style="color:var(--red);margin-top:3px"></i><span>' + t("site.privacy") + "</span></div></div>");
    });
  }

  function pageLogin() {
    $app.html('<div class="wrap formbox fade"><h1 style="font-size:2rem;text-align:center">' + t("site.loginTitle") + '</h1><p class="sub" style="text-align:center">' + t("site.loginSub") + '</p><div class="card"><form id="lf"><div id="le"></div><label class="f">' + t("site.email") + '<input type="email" name="email" required autocomplete="username"></label><label class="f">' + t("site.password") +
      '<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-primary btn-block">' + t("site.loginBtn") + '</button></form></div><p style="text-align:center;margin-top:1.2rem;color:var(--muted)">' + t("site.noAcc") + ' <a href="#/signup" class="red" style="font-weight:600">' + t("site.createOne") + "</a></p></div>");
    $("#lf").on("submit", function (e) {
      e.preventDefault();
      var $b = $("#lf button").prop("disabled", true).text(t("site.busy"));
      sb.auth.signInWithPassword({ email: this.email.value.trim(), password: this.password.value }).then(function (r) {
        if (r.error) { $("#le").html('<div class="err">' + t("site.loginErr") + "</div>"); $b.prop("disabled", false).text(t("site.loginBtn")); return; }
        candId = null; savedLoaded = false;
        getMe(true).then(function (me) {
          if (isStaff(me)) { location.href = "index.html?office"; return; }
          renderChrome(); loadSaved().then(function () { location.hash = "#/"; });
        });
      });
    });
  }

  function pageSignup() {
    $app.html('<div class="wrap formbox fade"><h1 style="font-size:2rem;text-align:center">' + t("site.signupTitle") + '</h1><p class="sub" style="text-align:center">' + t("site.signupSub") + '</p><div class="card"><form id="sf"><div id="se"></div><label class="f">' + t("site.fullName") + '<input name="name" required minlength="2" autocomplete="name"></label><label class="f">' + t("site.email") +
      '<input type="email" name="email" required autocomplete="email"></label><label class="f">' + t("site.pwHint") + '<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="btn btn-red btn-block">' + t("site.signupBtn") + '</button></form></div><p style="text-align:center;margin-top:1.2rem;color:var(--muted)">' + t("site.haveAcc") + ' <a href="#/login" class="red" style="font-weight:600">' + t("site.login") + "</a></p></div>");
    $("#sf").on("submit", function (e) {
      e.preventDefault();
      var f = this, $b = $("#sf button").prop("disabled", true).text(t("site.busy"));
      sb.auth.signUp({ email: f.email.value.trim(), password: f.password.value, options: { data: { full_name: f.name.value.trim(), locale: getLang() } } }).then(function (r) {
        $b.prop("disabled", false).text(t("site.signupBtn"));
        if (r.error) { $("#se").html('<div class="err">' + (r.error.code === "weak_password" ? t("site.errWeak") : /registered|exists/i.test(r.error.message) ? t("site.errExists") : t("site.errInvalid")) + "</div>"); return; }
        if (r.data.user && r.data.user.identities && r.data.user.identities.length === 0) { $("#se").html('<div class="err">' + t("site.errExists") + "</div>"); return; }
        if (!r.data.session) { $(f).closest(".card").html("<h3>" + t("site.checkTitle") + '</h3><p style="margin-top:.5rem">' + t("site.checkText") + "</p>"); return; }
        candId = null; savedLoaded = false; getMe(true).then(function () { renderChrome(); location.hash = "#/"; });
      });
    });
  }

  function pageProfile() {
    getMe().then(function (me) {
      if (!me) { location.hash = "#/login"; return; }
      var other = getLang() === "de" ? "en" : "de";
      $app.html('<div class="wrap page fade"><h1>' + t("site.profileTitle") + '</h1><p class="sub">' + esc(me.full_name || "") + '</p><div class="grid" style="max-width:460px">' +
        (isStaff(me) ? '<a class="btn btn-primary" href="index.html?office">' + t("site.openOffice") + "</a>" : "") +
        '<a class="btn btn-outline" href="mailto:' + CFG.BRAND.email + '">' + t("site.help") + '</a><button class="btn btn-outline" id="langsw">' + t("site.language") + ": " + other.toUpperCase() + '</button><button class="btn btn-red" id="logout">' + t("site.logout") + "</button></div></div>");
      $("#langsw").on("click", function () { setLang(other); });
      $("#logout").on("click", function () {
        sb.auth.signOut().then(function () { clearMe(); saved = new Set(); savedLoaded = false; candId = null; renderChrome(); location.hash = "#/"; });
      });
    });
  }

  function pageContact() {
    var L = CFG.LEGAL;
    $app.html('<div class="wrap page fade legal"><div class="eyebrow">' + t("site.navContact").toUpperCase() + "</div><h1>" + t("site.navContact") + '</h1><p class="sub">' + t("site.contactText") + '</p><div class="grid c2" style="max-width:640px"><a class="card hov" href="mailto:' + CFG.BRAND.email + '"><div class="ico"><i class="fa-solid fa-envelope"></i></div><h3>E-Mail</h3><p>' + esc(CFG.BRAND.email) + '</p></a><a class="card hov" href="#/messages"><div class="ico"><i class="fa-solid fa-comments"></i></div><h3>' + t("site.messages") + "</h3><p>" + t("site.contactChat") + "</p></a></div></div>");
  }
  function pageLegalOld(p) {
    var k = { imprint: "imprint", privacy: "privacyPol", terms: "terms" }[p.kind];
    if (!k) { $app.html('<div class="wrap page"><div class="empty">' + t("site.notFound") + "</div></div>"); return; }
    $app.html('<div class="wrap page fade"><h1>' + t("site." + k) + '</h1><div class="notice"><i class="fa-solid fa-circle-info" style="color:var(--red);margin-top:3px"></i><span>' + t("site.legalTodo") + "</span></div></div>");
  }

  /* ---------- router ---------- */
  var routes = [
    ["#/", pageHome], ["#/rooms", pageRooms], ["#/room/:id", pageRoom], ["#/saved", pageSaved], ["#/messages", pageMessages],
    ["#/notifications", pageNotifications], ["#/quality", pageQuality], ["#/login", pageLogin], ["#/signup", pageSignup],
    ["#/profile", pageProfile], ["#/legal/:kind", function (p) { $app.html('<div class="wrap page fade legal">' + legalHtml(p.kind) + "</div>"); }], ["#/contact", pageContact],
  ];
  var lastHash = null;
  var router = Router(routes, function (m) {
    timers.forEach(clearInterval); timers = [];
    setActive();
    if (location.hash !== lastHash) { window.scrollTo(0, 0); lastHash = location.hash; }
    if (!m) { $app.html('<div class="wrap page"><div class="empty">' + t("site.notFound") + "</div></div>"); return; }
    m.fn(m.params, m.q);
  });

  renderChrome(); cookieNotice();
  router.go(); // show the page straight away; hearts fill in as soon as we know who is logged in
  loadSaved().then(function () {
    $(".heart").each(function () {
      var on = saved.has($(this).data("id"));
      $(this).toggleClass("on", on).find("i").attr("class", "fa-" + (on ? "solid" : "regular") + " fa-heart");
    });
    if (location.hash === "#/saved") router.go();
  });
  // Warm the room list while the visitor reads the first screen.
  loadListings().then(function (l) { listings = l; listingsAt = Date.now(); });
})();

</script>
</body>
</html>
